<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICIP Certificate Server</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        #loading {
            font-size: 20px;
            color: #333;
        }

        #offline {
            display: none;
        }

        #offline h2 {
            color: #d32f2f;
        }

        #offline p {
            color: #555;
            line-height: 1.7;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <div id="loading">
        ⏳ সার্ভারের সাথে সংযোগ করা হচ্ছে...
    </div>

    <div id="offline">
        <h2>⚠️ সার্ভার বন্ধ আছে</h2>

        <p>
            SICIP Certificate Server বর্তমানে চালু নেই
            অথবা সার্ভারে সংযোগ করা যাচ্ছে না।
        </p>

        <button onclick="checkServer()">
            🔄 আবার চেষ্টা করুন
        </button>
    </div>

</div>

<script>

const SERVER = "https://anwar.tail6ab506.ts.net:8443/";

/*
   সার্ভারের একটি নির্দিষ্ট পেজে সংযোগ পরীক্ষা।
   সার্ভার চালু থাকলে redirect হবে।
   সার্ভার বন্ধ থাকলে এখানেই থাকবে।
*/
function checkServer() {

    const loading = document.getElementById("loading");
    const offline = document.getElementById("offline");

    loading.style.display = "block";
    offline.style.display = "none";

    const controller = new AbortController();

    // সর্বোচ্চ 5 সেকেন্ড অপেক্ষা করবে
    const timeout = setTimeout(() => {
        controller.abort();
    }, 5000);

    fetch(SERVER, {
        method: "GET",
        cache: "no-store",
        signal: controller.signal
    })
    .then(response => {

        clearTimeout(timeout);

        if (response.ok) {

            // সার্ভার চালু → মূল Webpage
            window.location.replace(SERVER);

        } else {

            // সার্ভার উত্তর দিয়েছে কিন্তু সমস্যা আছে
            showOffline();
        }
    })
    .catch(error => {

        clearTimeout(timeout);

        // সার্ভারে সংযোগ করা যায়নি
        showOffline();
    });
}

function showOffline() {

    document.getElementById("loading").style.display = "none";
    document.getElementById("offline").style.display = "block";
}

checkServer();

</script>

</body>
</html>
